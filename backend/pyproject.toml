[project]
name = "codegraph-agent"
version = "0.1.0"
description = "Structural knowledge graph agent for code repositories"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "networkx==3.4.2",
    "anthropic>=0.40,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.9.10",
    "pre-commit==4.2.0",
    "httpx==0.27.2",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegraph"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
# enabled by default in ruff >= 0.1

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24.0",
]
